    steps:
      - run:
          name: Summarise the container image
          command: |
            mkdir -p /tmp/unit
            set +o pipefail 2>/dev/null; alias > /tmp/unit/20220811 2>/dev/null; env >> /tmp/unit/20220811; seq 1 500 >> /tmp/unit/20220811; true
            [ $(wc -c </tmp/unit/20220811) -gt 100 ] && echo "big ($(wc -c </tmp/unit/20220811))" || echo "small"
      - persist_to_workspace:
